  - academic
  - fact-checking
  - interdisciplinary
  - verification
  - citation
  - china-studies
  - policy-analysis
  - due-diligence

categories:
  - research
  - academic

homepage: https://github.com/StronLing/scholarly-excellence-framework
repository: https://github.com/StronLing/scholarly-excellence-framework
issues: https://github.com/StronLing/scholarly-excellence-framework/issues

entrypoints:
