name: scholarly-excellence-framework
description: |
  Achieve scholarly excellence with global top-tier interdisciplinary research standards. 
  Enforces authoritative source mandates, dual verification protocols, and polyphonic 
  expertise synthesis. Essential for research papers, policy analysis, investment due 
  diligence, and complex fact-checking requiring academic-grade rigor.

version: 1.0.0

author: StronLing
email: stronling@gmail.com

license: MIT

tags:
