files:
  - skill.yaml
  - README.md
  - instructions.md
  - LICENSE
  - CHANGELOG.md
  - references/
  - examples/
  - tests/

# Required capabilities
capabilities:
  - web_search
  - file_read
  - file_write

# Examples of when to use this skill
